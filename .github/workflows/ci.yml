name: Pull Request CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - feat/project-discoverability-and-docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/project-discoverability-and-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Regenerate package-lock.json without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile if different
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile for reproducible CI"
          git push origin HEAD:refs/heads/feat/project-discoverability-and-docs

  validate:
    name: Type check, production build and static SEO pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Export synchronized package lock for repository repair
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Type check
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Validate guide content and SEO metadata
        run: npm run validate:guides

      - name: Verify static guide pages and crawler files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/guides/academic-literature-search/index.html
          test -s dist/guides/boolean-search/index.html
          test -s dist/guides/keyword-expansion/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'guides/academic-literature-search/' dist/sitemap.xml
          grep -q 'guides/boolean-search/' dist/sitemap.xml
          grep -q 'guides/keyword-expansion/' dist/sitemap.xml
