name: Pull Request CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check, production build and static SEO pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci


      - name: Report npm audit baseline
        run: npm run audit:report

      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run lint

      - name: Test scoped recovery and security helpers
        run: npm run test:security

      - name: Build production site
        run: npm run build

      - name: Verify JavaScript chunk size budget
        run: npm run validate:bundle

      - name: Validate guide content and SEO metadata
        run: npm run validate:guides

      - name: Verify static guide pages and crawler files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/guides/academic-literature-search/index.html
          test -s dist/guides/boolean-search/index.html
          test -s dist/guides/keyword-expansion/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'guides/academic-literature-search/' dist/sitemap.xml
          grep -q 'guides/boolean-search/' dist/sitemap.xml
          grep -q 'guides/keyword-expansion/' dist/sitemap.xml

  browser-smoke:
    name: Browser interaction and responsive smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Install isolated Playwright CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser-qa/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Start local preview and exercise browser
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 7
